      <line x1="118" y1="155" x2="146" y2="155" stroke="#7F77DD" stroke-width="1" marker-end="url(#a)"/>
      <line x1="228" y1="155" x2="256" y2="155" stroke="#7F77DD" stroke-width="1" marker-end="url(#a)"/>

      Click anywhere in latent space to see what the decoder would produce from that point.
    </div>

<script>
function showTab(t) {
  document.getElementById('tab-arch').style.display = t==='arch' ? '' : 'none';
  document.getElementById('tab-lat').style.display  = t==='lat'  ? '' : 'none';
  document.getElementById('tb-arch').classList.toggle('active', t==='arch');
  document.getElementById('tb-lat').classList.toggle('active',  t==='lat');
  if (t==='lat') drawLatent();
}

const isDark = matchMedia('(prefers-color-scheme: dark)').matches;

const CLUSTERS = [
  { mu:[1.5,1.5],  s:0.35, col:'#534AB7', name:'BBH low-mass',   n:90 },
  { mu:[-1.5,0.8], s:0.30, col:'#1D9E75', name:'BBH high-mass',  n:70 },
  { mu:[0.2,-1.8], s:0.25, col:'#D85A30', name:'BNS',            n:50 },
];

function lcg(seed){ let s=seed|0; return ()=>{ s=(s*1664525+1013904223)|0; return (s>>>0)/4294967296; }; }
const rr = lcg(77);
function bm(r){ const u=r()+1e-9,v=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

const pts = [];
CLUSTERS.forEach(c => {
  for(let i=0;i<c.n;i++) pts.push({ x:c.mu[0]+bm(rr)*c.s, y:c.mu[1]+bm(rr)*c.s, col:c.col, name:c.name });
});

const HOLES = [
  { x:0, y:0,    r:0.55, label:'hole — gap between clusters' },
  { x:1.5, y:-1, r:0.4,  label:'hole — never seen during training' },
];

function drawLatent(clickX, clickY) {
  const canvas = document.getElementById('lat-canvas');
  const ctx = canvas.getContext('2d');
  const dpr = devicePixelRatio;
  canvas.width  = canvas.offsetWidth  * dpr;
  canvas.height = canvas.offsetHeight * dpr;
  ctx.scale(dpr, dpr);
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  ctx.clearRect(0,0,W,H);

  const CX = W/2, CY = H/2, SCALE = Math.min(W,H)/6;
  const px = z => CX + z*SCALE;
  const py = z => CY - z*SCALE;

  ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.07)';
  ctx.lineWidth = 0.5;
  for(let g=-3;g<=3;g++){
    ctx.beginPath(); ctx.moveTo(px(g),py(-3.5)); ctx.lineTo(px(g),py(3.5)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px(-3.5),py(g)); ctx.lineTo(px(3.5),py(g)); ctx.stroke();
  }
  ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.18)'; ctx.lineWidth=0.8;
  ctx.beginPath(); ctx.moveTo(px(-3.5),CY); ctx.lineTo(px(3.5),CY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX,py(-3.5)); ctx.lineTo(CX,py(3.5)); ctx.stroke();

  HOLES.forEach(h => {
    ctx.beginPath();
    ctx.arc(px(h.x), py(h.y), h.r*SCALE, 0, Math.PI*2);
    ctx.fillStyle = isDark ? 'rgba(226,75,74,0.15)' : 'rgba(226,75,74,0.1)';
    ctx.strokeStyle = '#E24B4A'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
    ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
    ctx.font='11px sans-serif'; ctx.fillStyle='#E24B4A'; ctx.textAlign='center';
    ctx.fillText(h.label, px(h.x), py(h.y+h.r+0.2));
  });

  pts.forEach(p => {
    ctx.beginPath(); ctx.arc(px(p.x),py(p.y),3.5,0,Math.PI*2);
    ctx.fillStyle = p.col; ctx.globalAlpha=0.75; ctx.fill(); ctx.globalAlpha=1;
  });

  CLUSTERS.forEach(c => {
    ctx.font='12px sans-serif'; ctx.fillStyle=c.col; ctx.textAlign='center';
    ctx.fillText(c.name, px(c.mu[0]), py(c.mu[1]+c.s+0.25));
  });

  if(clickX !== undefined) {
    const zx = (clickX - CX) / SCALE;
    const zy = (CY - clickY) / SCALE;
    ctx.beginPath(); ctx.arc(px(zx), py(zy), 7, 0, Math.PI*2);
    const isHole = HOLES.some(h => Math.hypot(zx-h.x, zy-h.y) < h.r);
    ctx.strokeStyle = isHole ? '#E24B4A' : '#1D9E75';
    ctx.lineWidth=2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px(zx)-10,py(zy)); ctx.lineTo(px(zx)+10,py(zy));
    ctx.moveTo(px(zx),py(zy)-10); ctx.lineTo(px(zx),py(zy)+10);
    ctx.stroke();

    const dec = document.getElementById('decode-out');
    dec.style.display='';
    if(isHole){
      dec.style.color='var(--color-text-danger)';
      dec.innerHTML=`<b>Latent point (${zx.toFixed(2)}, ${zy.toFixed(2)})</b> — this is a <b>hole</b>.<br>
The decoder has never been trained on points here. It will output meaningless garbage — a blurry average of unrelated training examples.<br>
<span style="color:var(--color-text-tertiary)">This is the fundamental problem the VAE fixes in Step 7.</span>`;
    } else {
      const nearest = pts.reduce((best,p) => {
        const d=Math.hypot(p.x-zx,p.y-zy); return d<best.d?{d,name:p.name,col:p.col}:best;
      },{d:Infinity,name:'',col:''});
      dec.style.color='var(--color-text-success)';
      dec.innerHTML=`<b>Latent point (${zx.toFixed(2)}, ${zy.toFixed(2)})</b> — inside a known cluster.<br>
Decoder produces a plausible event similar to a <span style="color:${nearest.col};font-weight:500">${nearest.name}</span> merger. Reconstruction is meaningful here.`;
    }
  }

  ctx.font='11px sans-serif'; ctx.fillStyle = isDark?'rgba(255,255,255,0.35)':'rgba(0,0,0,0.35)';
  ctx.textAlign='left'; ctx.fillText('z₁',px(3.2),CY-8);
  ctx.textAlign='center'; ctx.fillText('z₂',CX+8,py(3.2));
}

document.getElementById('lat-canvas').addEventListener('click', e => {
  const r = e.target.getBoundingClientRect();
  drawLatent(e.clientX - r.left, e.clientY - r.top);
});
</script>
