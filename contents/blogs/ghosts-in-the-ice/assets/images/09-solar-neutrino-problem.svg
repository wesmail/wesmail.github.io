<svg class="blog-diagram" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 400" role="img" aria-label="Only a third of the expected solar neutrinos showed up" font-size="13"><rect width="760" height="400" style="fill:var(--fig-bg)"/><defs><marker id="sol-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-categorical-1)"></path></marker></defs><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">For 30 years, only a third of the expected solar neutrinos showed up</text><g data-claude-anchor="sun"><circle cx="100" cy="150" r="64" fill-opacity="0.2" stroke-width="2" style="fill:var(--cds-chart-categorical-3);stroke:var(--cds-chart-categorical-3)"></circle><circle cx="100" cy="150" r="18" fill-opacity="0.45" stroke-width="1.25" style="fill:var(--cds-chart-categorical-3);stroke:var(--cds-chart-categorical-3)"></circle><text data-claude-text-id="core" x="100" y="154" text-anchor="middle" font-size="11.5" font-weight="600" style="fill:var(--cds-text-primary)">core</text><text data-claude-text-id="fusion" x="100" y="238" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">4 protons → helium + 2 νₑ</text><text data-claude-text-id="fusion-2" x="100" y="254" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">+ energy (26.7 MeV)</text></g><path d="M170 150H392" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#sol-arrow)" style="stroke:var(--cds-chart-categorical-1)"></path><text data-claude-text-id="trip" x="280" y="140" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">about 8 minutes to Earth</text><g data-claude-anchor="mine"><rect x="400" y="92" width="336" height="190" rx="8" stroke-width="1.25" style="fill:var(--cds-chart-reference-tint);stroke:var(--cds-chart-axis)"></rect><text data-claude-text-id="mine-name" x="416" y="116" font-weight="600" style="fill:var(--cds-text-primary)">Homestake gold mine, South Dakota</text><text data-claude-text-id="mine-depth" x="416" y="134" font-size="11.5" style="fill:var(--cds-text-secondary)">about 1.5 km underground, shielded from cosmic rays</text><rect x="432" y="150" width="272" height="84" rx="30" fill="none" stroke-width="1.5" style="stroke:var(--cds-chart-axis)"></rect><text data-claude-text-id="tank" x="568" y="186" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">615 tonnes of cleaning fluid</text><text data-claude-text-id="tank-2" x="568" y="204" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">νₑ + chlorine → argon + electron</text><text data-claude-text-id="count" x="568" y="262" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">Ray Davis counted single argon atoms, a few per week</text></g><text data-claude-text-id="pred" x="400" y="322" font-weight="600" style="fill:var(--cds-text-primary)">Predicted (John Bahcall)</text><text data-claude-text-id="meas" x="400" y="364" font-weight="600" style="fill:var(--cds-text-primary)">Measured (Ray Davis)</text><g data-claude-anchor="predicted"><circle cx="620" cy="318" r="11" fill-opacity="0.3" stroke-width="1.5" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"></circle><circle cx="660" cy="318" r="11" fill-opacity="0.3" stroke-width="1.5" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"></circle><circle cx="700" cy="318" r="11" fill-opacity="0.3" stroke-width="1.5" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"></circle></g><g data-claude-anchor="measured"><circle cx="620" cy="360" r="11" fill-opacity="0.3" stroke-width="1.5" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"></circle><circle cx="660" cy="360" r="11" fill="none" stroke-width="1.5" stroke-dasharray="3 3" style="stroke:var(--cds-chart-status-critical)"></circle><circle cx="700" cy="360" r="11" fill="none" stroke-width="1.5" stroke-dasharray="3 3" style="stroke:var(--cds-chart-status-critical)"></circle><text data-claude-text-id="q1" x="660" y="364" text-anchor="middle" font-size="11.5" style="fill:var(--cds-chart-status-critical)">?</text><text data-claude-text-id="q2" x="700" y="364" text-anchor="middle" font-size="11.5" style="fill:var(--cds-chart-status-critical)">?</text></g></svg>