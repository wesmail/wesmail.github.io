<svg class="blog-diagram" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 300" role="img" aria-label="114 years from a balloon flight to a Nobel Prize for a telescope in the ice" font-size="13"><rect width="760" height="300" style="fill:var(--fig-bg)"/><defs><marker id="tl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-axis)"></path></marker></defs><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">114 years from a balloon flight to a Nobel Prize for a telescope in the ice</text><g data-claude-anchor="links" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"><path d="M152 102H168" marker-end="url(#tl-arrow)"></path><path d="M296 102H312" marker-end="url(#tl-arrow)"></path><path d="M440 102H456" marker-end="url(#tl-arrow)"></path><path d="M584 102H600" marker-end="url(#tl-arrow)"></path><path d="M664 140V170H88V196" marker-end="url(#tl-arrow)"></path><path d="M152 234H168" marker-end="url(#tl-arrow)"></path><path d="M296 234H312" marker-end="url(#tl-arrow)"></path><path d="M440 234H456" marker-end="url(#tl-arrow)"></path><path d="M584 234H600" marker-end="url(#tl-arrow)"></path></g><g data-claude-anchor="m1912"><rect x="24" y="64" width="128" height="76" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text data-claude-text-id="y1912" x="88" y="86" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">1912</text><text data-claude-text-id="e1912" x="88" y="104" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">Hess finds cosmic</text><text data-claude-text-id="e1912b" x="88" y="120" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">rays from a balloon</text></g><g data-claude-anchor="m1930"><rect x="168" y="64" width="128" height="76" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text data-claude-text-id="y1930" x="232" y="86" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">1930</text><text data-claude-text-id="e1930" x="232" y="104" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">Pauli proposes</text><text data-claude-text-id="e1930b" x="232" y="120" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">the neutrino</text></g><g data-claude-anchor="m1956"><rect x="312" y="64" width="128" height="76" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text data-claude-text-id="y1956" x="376" y="86" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">1956</text><text data-claude-text-id="e1956" x="376" y="104" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">first neutrino</text><text data-claude-text-id="e1956b" x="376" y="120" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">caught at a reactor</text></g><g data-claude-anchor="m1968"><rect x="456" y="64" width="128" height="76" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text data-claude-text-id="y1968" x="520" y="86" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">1968</text><text data-claude-text-id="e1968" x="520" y="104" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">Davis: two thirds</text><text data-claude-text-id="e1968b" x="520" y="120" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">of solar ν missing</text></g><g data-claude-anchor="m1998"><rect x="600" y="64" width="128" height="76" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text data-claude-text-id="y1998" x="664" y="86" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">1998–2002</text><text data-claude-text-id="e1998" x="664" y="104" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">neutrinos oscillate:</text><text data-claude-text-id="e1998b" x="664" y="120" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">they have mass</text></g><g data-claude-anchor="m2010"><rect x="24" y="196" width="128" height="76" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text data-claude-text-id="y2010" x="88" y="218" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">2010</text><text data-claude-text-id="e2010" x="88" y="236" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">IceCube completed</text><text data-claude-text-id="e2010b" x="88" y="252" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">at the South Pole</text></g><g data-claude-anchor="m2013"><rect x="168" y="196" width="128" height="76" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text data-claude-text-id="y2013" x="232" y="218" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">2013</text><text data-claude-text-id="e2013" x="232" y="236" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">first cosmic</text><text data-claude-text-id="e2013b" x="232" y="252" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">neutrinos</text></g><g data-claude-anchor="m2017"><rect x="312" y="196" width="128" height="76" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text data-claude-text-id="y2017" x="376" y="218" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">2017</text><text data-claude-text-id="e2017" x="376" y="236" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">a neutrino from</text><text data-claude-text-id="e2017b" x="376" y="252" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">blazar TXS 0506+056</text></g><g data-claude-anchor="m2023"><rect x="456" y="196" width="128" height="76" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text data-claude-text-id="y2023" x="520" y="218" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">2022–2023</text><text data-claude-text-id="e2023" x="520" y="236" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">NGC 1068 and the</text><text data-claude-text-id="e2023b" x="520" y="252" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">Milky Way in ν</text></g><g data-claude-anchor="m2026"><rect x="600" y="196" width="128" height="76" rx="8" fill-opacity="0.12" stroke-width="2" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"></rect><text data-claude-text-id="y2026" x="664" y="218" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">2026</text><text data-claude-text-id="e2026" x="664" y="236" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">Nobel Prize for</text><text data-claude-text-id="e2026b" x="664" y="252" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">Francis Halzen</text></g><text data-claude-text-id="note" x="24" y="290" font-size="11.5" style="fill:var(--cds-text-secondary)">Milestones evenly spaced, not to scale in time</text></svg>