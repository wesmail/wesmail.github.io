<svg class="blog-diagram" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 470" role="img" aria-label="Wanted: the neutrino, the particle that ran off with the missing energy" font-size="13"><rect width="760" height="470" style="fill:var(--fig-bg)"/><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">Wanted: the particle that ran off with the missing energy</text><g data-claude-anchor="poster"><rect x="200" y="52" width="360" height="400" rx="6" fill-opacity="0.12" stroke-width="2" style="fill:var(--cds-chart-categorical-3);stroke:var(--cds-chart-categorical-3)"></rect><text data-claude-text-id="wanted" x="380" y="96" text-anchor="middle" font-size="30" font-weight="700" style="fill:var(--cds-text-primary)">WANTED</text><text data-claude-text-id="dead-or" x="380" y="118" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">dead or alive (it is very much alive)</text><rect x="300" y="132" width="160" height="120" rx="4" fill="none" stroke-width="1.25" stroke-dasharray="5 4" style="stroke:var(--cds-chart-axis)"></rect><text data-claude-text-id="photo-q" x="380" y="204" text-anchor="middle" font-size="40" font-weight="600" style="fill:var(--cds-chart-categorical-1)">ν ?</text><text data-claude-text-id="photo-note" x="380" y="244" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">no photo: it doesn&#x27;t show up</text><text data-claude-text-id="name" x="380" y="280" text-anchor="middle" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">THE NEUTRINO</text><text data-claude-text-id="f1" x="224" y="308" font-size="11.5" style="fill:var(--cds-text-primary)">Last seen: leaving beta decays with the missing energy</text><text data-claude-text-id="f2" x="224" y="326" font-size="11.5" style="fill:var(--cds-text-primary)">Charge: none · Mass: almost none</text><text data-claude-text-id="f3" x="224" y="344" font-size="11.5" style="fill:var(--cds-text-primary)">Contacts: weak force only (and a bit of gravity)</text><text data-claude-text-id="f4" x="224" y="362" font-size="11.5" style="fill:var(--cds-text-primary)">Known hideout: everywhere, including you</text><line x1="224" y1="380" x2="536" y2="380" stroke-width="1" style="stroke:var(--cds-chart-axis)"></line><text data-claude-text-id="f5" x="224" y="400" font-size="11.5" style="fill:var(--cds-text-secondary)">Reported by: Wolfgang Pauli, 1930</text><text data-claude-text-id="f6" x="224" y="418" font-size="11.5" style="fill:var(--cds-text-secondary)">Named by: Enrico Fermi (“the little neutral one”)</text><text data-claude-text-id="f7" x="224" y="436" font-size="11.5" style="fill:var(--cds-text-secondary)">Finally caught: Reines and Cowan, 1956</text></g><circle cx="214" cy="66" r="4" style="fill:var(--cds-chart-axis)"></circle><circle cx="546" cy="66" r="4" style="fill:var(--cds-chart-axis)"></circle></svg>