<svg class="blog-diagram" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 530" role="img" aria-label="Neutrinos were set free one second after the Big Bang and are still all around us" font-size="13"><rect width="760" height="530" style="fill:var(--fig-bg)"/><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">Neutrinos were set free one second after the Big Bang, and are still all around us</text><text data-claude-text-id="subtitle" x="24" y="52" font-size="11.5" style="fill:var(--cds-text-secondary)">A short history of the Universe, not to scale; the cone widens as space expands</text><path d="M181 76L187 76L218 500L150 500Z" stroke-width="1" style="fill:var(--cds-chart-reference-tint);stroke:var(--cds-chart-axis)"></path><g><circle cx="184" cy="96" r="7" fill-opacity="0.3" stroke-width="1.25" style="fill:var(--cds-chart-categorical-5);stroke:var(--cds-chart-axis)"></circle></g><g><circle cx="184" cy="172" r="9" fill-opacity="0.35" stroke-width="2" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"></circle></g><g><circle cx="184" cy="248" r="7" fill-opacity="0.3" stroke-width="1.25" style="fill:var(--cds-chart-categorical-5);stroke:var(--cds-chart-axis)"></circle></g><g><circle cx="184" cy="324" r="7" fill-opacity="0.3" stroke-width="1.25" style="fill:var(--cds-chart-categorical-5);stroke:var(--cds-chart-axis)"></circle></g><g><circle cx="184" cy="400" r="7" fill-opacity="0.3" stroke-width="1.25" style="fill:var(--cds-chart-categorical-5);stroke:var(--cds-chart-axis)"></circle></g><g><circle cx="184" cy="476" r="7" fill-opacity="0.3" stroke-width="1.25" style="fill:var(--cds-chart-categorical-5);stroke:var(--cds-chart-axis)"></circle></g><text data-claude-text-id="t1" x="160" y="100" text-anchor="end" font-weight="600" style="fill:var(--cds-text-primary)">the first instant</text><text data-claude-text-id="e1" x="232" y="94" font-weight="600" style="fill:var(--cds-text-primary)">Big Bang, then a burst of inflation</text><text data-claude-text-id="e1b" x="232" y="110" font-size="11.5" style="fill:var(--cds-text-secondary)">a hot, dense soup of particles and radiation</text><text data-claude-text-id="t2" x="160" y="176" text-anchor="end" font-weight="600" style="fill:var(--cds-text-primary)">≈ 1 second</text><text data-claude-text-id="e2" x="232" y="170" font-weight="600" style="fill:var(--cds-text-primary)">Neutrinos stop interacting and fly free</text><text data-claude-text-id="e2b" x="232" y="186" font-size="11.5" style="fill:var(--cds-text-secondary)">the cosmic neutrino background: about 340 per cm³, at 1.95 K, still undetected</text><text data-claude-text-id="t3" x="160" y="252" text-anchor="end" font-weight="600" style="fill:var(--cds-text-primary)">≈ 3 minutes</text><text data-claude-text-id="e3" x="232" y="246" font-weight="600" style="fill:var(--cds-text-primary)">The first nuclei form</text><text data-claude-text-id="e3b" x="232" y="262" font-size="11.5" style="fill:var(--cds-text-secondary)">about three quarters hydrogen and one quarter helium, by mass</text><text data-claude-text-id="t4" x="160" y="328" text-anchor="end" font-weight="600" style="fill:var(--cds-text-primary)">≈ 380,000 years</text><text data-claude-text-id="e4" x="232" y="322" font-weight="600" style="fill:var(--cds-text-primary)">Atoms form and light breaks free</text><text data-claude-text-id="e4b" x="232" y="338" font-size="11.5" style="fill:var(--cds-text-secondary)">the cosmic microwave background, cooled today to 2.7 K</text><text data-claude-text-id="t5" x="160" y="404" text-anchor="end" font-weight="600" style="fill:var(--cds-text-primary)">first ~100s of Myr</text><text data-claude-text-id="e5" x="232" y="398" font-weight="600" style="fill:var(--cds-text-primary)">First stars, galaxies and black holes</text><text data-claude-text-id="e5b" x="232" y="414" font-size="11.5" style="fill:var(--cds-text-secondary)">later: supernovae, active galaxies, the cosmic accelerators of this story</text><text data-claude-text-id="t6" x="160" y="480" text-anchor="end" font-weight="600" style="fill:var(--cds-text-primary)">13.8 billion years</text><text data-claude-text-id="e6" x="232" y="474" font-weight="600" style="fill:var(--cds-text-primary)">Today</text><text data-claude-text-id="e6b" x="232" y="490" font-size="11.5" style="fill:var(--cds-text-secondary)">the expansion is speeding up, and you are reading this</text></svg>