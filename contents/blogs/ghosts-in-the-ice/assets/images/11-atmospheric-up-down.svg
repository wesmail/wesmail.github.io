<svg class="blog-diagram" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 540" role="img" aria-label="Neutrinos from below had time to change flavour; those from above did not" font-size="13"><rect width="760" height="540" style="fill:var(--fig-bg)"/><defs><marker id="atm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-categorical-2)"></path></marker></defs><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">Neutrinos from below had time to change flavour; those from above did not</text><g data-claude-anchor="earth"><circle cx="260" cy="310" r="196" fill="none" stroke-width="1" stroke-dasharray="3 4" style="stroke:var(--cds-chart-axis)"></circle><circle cx="260" cy="310" r="180" stroke-width="1.25" style="fill:var(--cds-chart-reference-tint);stroke:var(--cds-chart-axis)"></circle><text data-claude-text-id="earth-name" x="206" y="318" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">Earth</text><text data-claude-text-id="air" x="464" y="314" font-size="11.5" style="fill:var(--cds-text-secondary)">← atmosphere, where cosmic rays make neutrinos</text></g><g data-claude-anchor="detector"><rect x="246" y="130" width="28" height="18" rx="3" fill-opacity="0.25" stroke-width="1.5" style="fill:var(--cds-chart-categorical-2);stroke:var(--cds-chart-categorical-2)"></rect><text data-claude-text-id="det" x="284" y="112" font-size="11.5" font-weight="600" style="fill:var(--cds-text-primary)">detector</text></g><path d="M260 66V124" stroke-width="2" marker-end="url(#atm-arrow)" style="stroke:var(--cds-chart-categorical-2)"></path><path d="M260 504V154" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#atm-arrow)" style="stroke:var(--cds-chart-categorical-2)"></path><g data-claude-anchor="card-above"><rect x="452" y="56" width="284" height="72" rx="8" fill="none" stroke-width="1.5" style="stroke:var(--cds-chart-status-good)"></rect><text data-claude-text-id="above-name" x="466" y="80" font-weight="600" style="fill:var(--cds-text-primary)">From above: ~15 km of air</text><text data-claude-text-id="above-1" x="466" y="98" font-size="11.5" style="fill:var(--cds-text-primary)">Muon neutrinos arrive just as</text><text data-claude-text-id="above-2" x="466" y="114" font-size="11.5" style="fill:var(--cds-text-primary)">expected: too little time to change.</text></g><g data-claude-anchor="card-below"><rect x="452" y="392" width="284" height="88" rx="8" fill="none" stroke-width="1.5" style="stroke:var(--cds-chart-status-critical)"></rect><text data-claude-text-id="below-name" x="466" y="416" font-weight="600" style="fill:var(--cds-text-primary)">From below: ~12,700 km of Earth</text><text data-claude-text-id="below-1" x="466" y="434" font-size="11.5" style="fill:var(--cds-text-primary)">About half of the muon neutrinos are</text><text data-claude-text-id="below-2" x="466" y="450" font-size="11.5" style="fill:var(--cds-text-primary)">missing: they turned into tau neutrinos</text><text data-claude-text-id="below-3" x="466" y="466" font-size="11.5" style="fill:var(--cds-text-primary)">on the way (Super-Kamiokande, 1998)</text></g><path d="M272 480L452 440" fill="none" stroke-width="1" stroke-dasharray="3 3" style="stroke:var(--cds-chart-axis)"></path><path d="M272 90L452 92" fill="none" stroke-width="1" stroke-dasharray="3 3" style="stroke:var(--cds-chart-axis)"></path></svg>