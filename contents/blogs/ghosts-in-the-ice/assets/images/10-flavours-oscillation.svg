<svg class="blog-diagram" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 580" role="img" aria-label="Three flavours, and a neutrino born as one arrives as a mix" font-size="13"><rect width="760" height="580" style="fill:var(--fig-bg)"/><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">Three flavours, and a neutrino born as one can arrive as another</text><g data-claude-anchor="family-e">
