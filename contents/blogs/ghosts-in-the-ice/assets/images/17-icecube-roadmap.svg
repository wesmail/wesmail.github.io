<svg class="blog-diagram" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 470" role="img" aria-label="From IceCube to the Upgrade to IceCube-Gen2" font-size="13"><rect width="760" height="470" style="fill:var(--fig-bg)"/><defs><marker id="rm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-axis)"></path></marker></defs><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">From IceCube to the Upgrade to IceCube-Gen2</text><g data-claude-anchor="phase-icecube"><rect x="24" y="64" width="216" height="168" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text data-claude-text-id="p1-name" x="132" y="90" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">IceCube</text><text data-claude-text-id="p1-date" x="132" y="108" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">completed December 2010</text><text data-claude-text-id="p1-a" x="40" y="136" font-size="11.5" style="fill:var(--cds-text-primary)">86 strings, 5,160 DOMs</text><text data-claude-text-id="p1-b" x="40" y="154" font-size="11.5" style="fill:var(--cds-text-primary)">1 km³ of instrumented ice</text><text data-claude-text-id="p1-c" x="40" y="172" font-size="11.5" style="fill:var(--cds-text-primary)">discovered cosmic neutrinos</text><text data-claude-text-id="p1-d" x="40" y="190" font-size="11.5" style="fill:var(--cds-text-primary)">(2013), first sources</text></g><g data-claude-anchor="phase-upgrade"><rect x="272" y="64" width="216" height="168" rx="8" fill-opacity="0.12" stroke-width="2" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"></rect><text data-claude-text-id="p2-name" x="380" y="90" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">IceCube Upgrade</text><text data-claude-text-id="p2-date" x="380" y="108" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">deployed 2025/26, data soon</text><text data-claude-text-id="p2-a" x="288" y="136" font-size="11.5" style="fill:var(--cds-text-primary)">7 dense strings, ~700 sensors</text><text data-claude-text-id="p2-b" x="288" y="154" font-size="11.5" style="fill:var(--cds-text-primary)">402 mDOMs + 277 D-Eggs</text><text data-claude-text-id="p2-c" x="288" y="172" font-size="11.5" style="fill:var(--cds-text-primary)">GeV oscillations, better ice</text><text data-claude-text-id="p2-d" x="288" y="190" font-size="11.5" style="fill:var(--cds-text-primary)">calibration for all old data</text></g><g data-claude-anchor="phase-gen2"><rect x="520" y="64" width="216" height="168" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text data-claude-text-id="p3-name" x="628" y="90" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">IceCube-Gen2</text><text data-claude-text-id="p3-date" x="628" y="108" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">proposed</text><text data-claude-text-id="p3-a" x="536" y="136" font-size="11.5" style="fill:var(--cds-text-primary)">~120 new strings, up to 80</text><text data-claude-text-id="p3-b" x="536" y="154" font-size="11.5" style="fill:var(--cds-text-primary)">sensors each (the LOM)</text><text data-claude-text-id="p3-c" x="536" y="172" font-size="11.5" style="fill:var(--cds-text-primary)">~8 km³ optical array, plus</text><text data-claude-text-id="p3-d" x="536" y="190" font-size="11.5" style="fill:var(--cds-text-primary)">radio and surface arrays</text></g><g data-claude-anchor="arrows" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"><path d="M240 148H272" marker-end="url(#rm-arrow)"></path><path d="M488 148H520" marker-end="url(#rm-arrow)"></path></g><text data-claude-text-id="top-view" x="24" y="272" font-weight="600" style="fill:var(--cds-text-primary)">Seen from above (sketch)</text><g data-claude-anchor="footprints"><ellipse cx="380" cy="360" rx="300" ry="86" fill-opacity="0.08" stroke-width="1.5" stroke-dasharray="6 4" style="fill:var(--cds-chart-categorical-5);stroke:var(--cds-chart-categorical-5)"></ellipse><path d="M434 360L407 399.83716857408416L353 399.83716857408416L326 360L353 320.16283142591584L407 320.16283142591584Z" fill-opacity="0.12" stroke-width="1.5" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"></path><circle cx="380" cy="360" r="6" style="fill:var(--cds-text-primary)"></circle></g><text data-claude-text-id="fp-ic" x="380" y="334" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">IceCube</text><text data-claude-text-id="fp-up" x="392" y="380" font-size="11.5" style="fill:var(--cds-text-primary)">Upgrade</text><text data-claude-text-id="fp-g2" x="560" y="366" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">Gen2 optical array</text><text data-claude-text-id="fp-g2b" x="560" y="382" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">about 8× the volume</text></svg>