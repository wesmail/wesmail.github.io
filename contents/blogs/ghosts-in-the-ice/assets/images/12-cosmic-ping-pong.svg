<svg class="blog-diagram" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 470" role="img" aria-label="Cosmic ping-pong makes fast protons; their collisions make gamma rays and neutrinos" font-size="13"><rect width="760" height="470" style="fill:var(--fig-bg)"/><defs><marker id="pp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-axis)"></path></marker><marker id="pp-nu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-categorical-1)"></path></marker><marker id="pp-ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-categorical-3)"></path></marker></defs><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">Cosmic ping-pong makes fast protons; their collisions make gamma rays and neutrinos</text><text data-claude-text-id="left-head" x="172" y="72" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">1. Cosmic ping-pong</text><g data-claude-anchor="walls" fill="none" stroke-width="1.5" style="stroke:var(--cds-chart-axis)"><path d="M80 92q10 18 0 36q-10 18 0 36q10 18 0 36q-10 18 0 36q10 18 0 36q-10 18 0 36q10 18 0 36"></path><path d="M264 92q10 18 0 36q-10 18 0 36q10 18 0 36q-10 18 0 36q10 18 0 36q-10 18 0 36q10 18 0 36"></path></g><text data-claude-text-id="wall-a" x="80" y="358" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">magnetic</text><text data-claude-text-id="wall-a2" x="80" y="374" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">turbulence</text><text data-claude-text-id="wall-b" x="264" y="358" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">shock</text><text data-claude-text-id="wall-b2" x="264" y="374" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">front</text><g data-claude-anchor="zigzag" fill="none" style="stroke:var(--cds-chart-categorical-4)"><path d="M92 108L252 130" stroke-width="1.25"></path><path d="M252 130L92 160" stroke-width="1.75"></path><path d="M92 160L252 194" stroke-width="2.25"></path><path d="M252 194L92 230" stroke-width="2.75"></path><path d="M92 230L252 270" stroke-width="3.25"></path><path d="M252 270L330 300" stroke-width="3.75" marker-end="url(#pp-arrow)"></path></g><text data-claude-text-id="gain" x="172" y="300" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">a little more energy</text><text data-claude-text-id="gain-2" x="172" y="316" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">with every bounce</text><text data-claude-text-id="escape" x="300" y="330" font-size="11.5" style="fill:var(--cds-text-primary)">escapes, very fast</text><line x1="354" y1="60" x2="354" y2="440" style="stroke:var(--cds-chart-grid)"></line><text data-claude-text-id="right-head" x="552" y="72" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">2. The particle factory</text><path d="M376 150H430" stroke-width="2.5" marker-end="url(#pp-arrow)" style="stroke:var(--cds-chart-categorical-4)"></path><text data-claude-text-id="p-in" x="378" y="140" font-size="11.5" style="fill:var(--cds-text-primary)">fast proton</text><circle cx="442" cy="150" r="9" fill-opacity="0.3" stroke-width="1.5" style="fill:var(--cds-chart-categorical-4);stroke:var(--cds-chart-categorical-4)"></circle><text data-claude-text-id="target" x="442" y="182" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">hits gas or light</text><g data-claude-anchor="pions" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"><path d="M450 144L520 110"></path><path d="M450 158L520 222"></path></g><text data-claude-text-id="pi0" x="526" y="114" font-weight="600" style="fill:var(--cds-text-primary)">π⁰</text><text data-claude-text-id="piplus" x="526" y="226" font-weight="600" style="fill:var(--cds-text-primary)">π⁺</text><g data-claude-anchor="gammas" fill="none" stroke-width="1.75" style="stroke:var(--cds-chart-categorical-3)"><path d="M548 106L640 86" marker-end="url(#pp-ga)"></path><path d="M548 112L640 130" marker-end="url(#pp-ga)"></path></g><text data-claude-text-id="g-label" x="652" y="96" font-size="11.5" style="fill:var(--cds-text-primary)">γ</text><text data-claude-text-id="g-label-2" x="652" y="136" font-size="11.5" style="fill:var(--cds-text-primary)">γ</text><text data-claude-text-id="gamma-note" x="672" y="116" font-size="11.5" font-weight="600" style="fill:var(--cds-text-primary)">gamma rays</text><path d="M548 216L640 196" fill="none" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#pp-nu)" style="stroke:var(--cds-chart-categorical-1)"></path><text data-claude-text-id="numu" x="652" y="200" font-size="11.5" style="fill:var(--cds-text-primary)">νμ</text><path d="M546 232L596 280" fill="none" stroke-width="1.75" style="stroke:var(--cds-chart-categorical-2)"></path><text data-claude-text-id="muplus" x="584" y="300" font-size="11.5" font-weight="600" style="fill:var(--cds-text-primary)">μ⁺</text><g data-claude-anchor="mu-decay" fill="none" stroke-width="1.75"><path d="M606 284L680 262" stroke-dasharray="5 4" marker-end="url(#pp-nu)" style="stroke:var(--cds-chart-categorical-1)"></path><path d="M606 290L680 300" stroke-dasharray="5 4" marker-end="url(#pp-nu)" style="stroke:var(--cds-chart-categorical-1)"></path><path d="M604 296L660 340" style="stroke:var(--cds-chart-axis)"></path></g><text data-claude-text-id="nue" x="688" y="266" font-size="11.5" style="fill:var(--cds-text-primary)">νₑ</text><text data-claude-text-id="numubar" x="688" y="304" font-size="11.5" style="fill:var(--cds-text-primary)">νμ</text><text data-claude-text-id="numubar-note" x="706" y="304" font-size="9.5" style="fill:var(--cds-text-secondary)">(anti)</text><text data-claude-text-id="positron" x="666" y="350" font-size="11.5" style="fill:var(--cds-text-primary)">e⁺</text><text data-claude-text-id="nu-note" x="700" y="232" text-anchor="middle" font-size="11.5" font-weight="600" style="fill:var(--cds-text-primary)">neutrinos</text><text data-claude-text-id="foot-1" x="378" y="400" font-size="11.5" style="fill:var(--cds-text-primary)">Each π⁰ gives two gamma rays; each π⁺ gives three neutrinos.</text><text data-claude-text-id="foot-2" x="378" y="418" font-size="11.5" style="fill:var(--cds-text-primary)">Neutrinos need protons or nuclei: a smoking gun</text><text data-claude-text-id="foot-3" x="378" y="434" font-size="11.5" style="fill:var(--cds-text-primary)">for cosmic-ray accelerators.</text></svg>