<svg class="blog-diagram" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 520" role="img" aria-label="One cosmic proton, millions of particles: an air shower" font-size="13"><rect width="760" height="520" style="fill:var(--fig-bg)"/><defs><marker id="sh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-axis)"></path></marker><marker id="sh-nu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-categorical-1)"></path></marker></defs><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">One cosmic proton, millions of particles: an air shower</text><g data-claude-anchor="primary"><path d="M320 50V104" stroke-width="2" marker-end="url(#sh-arrow)" style="stroke:var(--cds-chart-axis)"></path><text data-claude-text-id="primary-name" x="332" y="66" font-size="11.5" style="fill:var(--cds-text-primary)">a cosmic proton from space</text><circle cx="320" cy="112" r="7" fill-opacity="0.3" stroke-width="1.5" style="fill:var(--cds-chart-categorical-4);stroke:var(--cds-chart-categorical-4)"></circle></g><text data-claude-text-id="alt-first" x="24" y="116" font-size="11.5" style="fill:var(--cds-text-secondary)">≈ 15–20 km up:</text><text data-claude-text-id="alt-first-2" x="24" y="132" font-size="11.5" style="fill:var(--cds-text-secondary)">first collision</text><g data-claude-anchor="hadrons" fill="none" stroke-width="1.5" style="stroke:var(--cds-chart-categorical-4)"><path d="M320 112L240 172"></path><path d="M320 112L410 172"></path><path d="M320 112L332 192"></path><circle cx="332" cy="196" r="5" fill-opacity="0.3" style="fill:var(--cds-chart-categorical-4)"></circle><path d="M332 196L372 256"></path><path d="M332 196L312 262"></path></g><text data-claude-text-id="pi0" x="222" y="168" style="fill:var(--cds-text-primary)">π⁰</text><text data-claude-text-id="piplus" x="418" y="168" style="fill:var(--cds-text-primary)">π⁺</text><g data-claude-anchor="em-cascade" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-categorical-3)"><path d="M240 172L196 232M240 172L282 232M196 232L176 300M196 232L214 300M282 232L262 300M282 232L300 300"></path><path d="M176 300L150 440"></path><path d="M176 300L186 440"></path><path d="M214 300L206 440"></path><path d="M214 300L232 440"></path><path d="M262 300L252 440"></path><path d="M262 300L276 440"></path><path d="M300 300L292 440"></path><path d="M300 300L318 440"></path></g><text data-claude-text-id="gamma-a" x="176" y="230" font-size="11.5" style="fill:var(--cds-text-primary)">γ</text><text data-claude-text-id="gamma-b" x="292" y="230" font-size="11.5" style="fill:var(--cds-text-primary)">γ</text><g data-claude-anchor="muons" fill="none" stroke-width="1.75" style="stroke:var(--cds-chart-categorical-2)"><path d="M410 172L436 262L452 440"></path><path d="M372 256L384 440"></path><path d="M312 262L338 440"></path></g><text data-claude-text-id="mu-label" x="446" y="258" style="fill:var(--cds-text-primary)">μ⁺</text><text data-claude-text-id="nu-label" x="468" y="254" style="fill:var(--cds-text-primary)">ν</text><text data-claude-text-id="em-name" x="24" y="300" font-weight="600" style="fill:var(--cds-text-primary)">Electromagnetic</text><text data-claude-text-id="em-name-2" x="24" y="318" font-weight="600" style="fill:var(--cds-text-primary)">cascade</text><text data-claude-text-id="em-body" x="24" y="336" font-size="11.5" style="fill:var(--cds-text-secondary)">photons, e⁺, e⁻</text><text data-claude-text-id="had-name" x="560" y="150" font-weight="600" style="fill:var(--cds-text-primary)">Hadrons</text><text data-claude-text-id="had-body" x="560" y="168" font-size="11.5" style="fill:var(--cds-text-secondary)">pions, kaons, nucleons</text><text data-claude-text-id="mu-name" x="560" y="252" font-weight="600" style="fill:var(--cds-text-primary)">Muons</text><text data-claude-text-id="mu-body" x="560" y="270" font-size="11.5" style="fill:var(--cds-text-secondary)">reach the ground, and even</text><text data-claude-text-id="mu-body-2" x="560" y="286" font-size="11.5" style="fill:var(--cds-text-secondary)">kilometres underground</text><text data-claude-text-id="nu-name" x="560" y="356" font-weight="600" style="fill:var(--cds-text-primary)">Neutrinos</text><text data-claude-text-id="nu-body" x="560" y="374" font-size="11.5" style="fill:var(--cds-text-secondary)">fly straight through the Earth;</text><text data-claude-text-id="nu-body-2" x="560" y="390" font-size="11.5" style="fill:var(--cds-text-secondary)">remember them for later</text><g data-claude-anchor="ground"><rect x="40" y="440" width="680" height="60" rx="8" stroke-width="1.25" style="fill:var(--cds-chart-reference-tint);stroke:var(--cds-chart-axis)"></rect><rect x="196" y="430" width="16" height="10" rx="2" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><rect x="270" y="430" width="16" height="10" rx="2" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><rect x="344" y="430" width="16" height="10" rx="2" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><rect x="418" y="430" width="16" height="10" rx="2" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text data-claude-text-id="footprint" x="300" y="476" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">footprint at the ground: up to several km wide</text></g><text data-claude-text-id="alt-ground" x="24" y="426" font-size="11.5" style="fill:var(--cds-text-secondary)">ground level</text><g data-claude-anchor="neutrino" fill="none" stroke-width="1.5" stroke-dasharray="5 4" style="stroke:var(--cds-chart-categorical-1)"><path d="M410 172L531 512" marker-end="url(#sh-nu)"></path></g><text data-claude-text-id="nu-through" x="542" y="488" font-size="11" style="fill:var(--cds-text-primary)">…and the neutrino keeps going</text></svg>