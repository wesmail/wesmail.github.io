<svg class="blog-diagram" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 320" role="img" aria-label="Every second, tens of billions of solar neutrinos pass through each square centimetre of you" font-size="13"><rect width="760" height="320" style="fill:var(--fig-bg)"/><defs><marker id="nu-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-categorical-1)"></path></marker></defs><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">Every second, tens of billions of solar neutrinos pass through each cm² of you</text><g data-claude-anchor="sun"><circle cx="96" cy="172" r="46" fill-opacity="0.25" stroke-width="2" style="fill:var(--fig-sun);stroke:var(--fig-sun)"></circle><line x1="150" y1="172" x2="162" y2="172" stroke-width="2" style="stroke:var(--fig-sun)"></line><line x1="134.18376618407356" y1="210.18376618407356" x2="142.66904755831214" y2="218.66904755831212" stroke-width="2" style="stroke:var(--fig-sun)"></line><line x1="96" y1="226" x2="96" y2="238" stroke-width="2" style="stroke:var(--fig-sun)"></line><line x1="57.81623381592644" y1="210.18376618407356" x2="49.33095244168787" y2="218.66904755831214" stroke-width="2" style="stroke:var(--fig-sun)"></line><line x1="42" y1="172" x2="30" y2="172" stroke-width="2" style="stroke:var(--fig-sun)"></line><line x1="57.816233815926424" y1="133.81623381592644" x2="49.330952441687856" y2="125.33095244168787" stroke-width="2" style="stroke:var(--fig-sun)"></line><line x1="95.99999999999999" y1="118" x2="95.99999999999999" y2="106" stroke-width="2" style="stroke:var(--fig-sun)"></line><line x1="134.18376618407356" y1="133.8162338159264" x2="142.66904755831212" y2="125.33095244168786" stroke-width="2" style="stroke:var(--fig-sun)"></line><text data-claude-text-id="sun-name" x="96" y="177" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">the Sun</text><text data-claude-text-id="sun-flux" x="24" y="262" font-size="11.5" style="fill:var(--cds-text-secondary)">≈ 6 × 10¹⁰ neutrinos per cm² per second</text></g><g data-claude-anchor="neutrinos" fill="none" stroke-width="1.25" stroke-dasharray="6 5" style="stroke:var(--cds-chart-categorical-1)"><path d="M160 112H724" marker-end="url(#nu-arrow)"></path><path d="M160 136H724" marker-end="url(#nu-arrow)"></path><path d="M160 160H724" marker-end="url(#nu-arrow)"></path><path d="M160 184H724" marker-end="url(#nu-arrow)"></path><path d="M160 208H724" marker-end="url(#nu-arrow)"></path><path d="M160 232H724" marker-end="url(#nu-arrow)"></path></g><defs><clipPath id="you-face-clip"><circle cx="420" cy="108" r="22"></circle></clipPath></defs><g data-claude-anchor="you" stroke-width="2" fill="none" style="stroke:var(--cds-chart-axis)"><image href="assets/images/portrait-waleed.png" x="398" y="86" width="44" height="44" clip-path="url(#you-face-clip)" preserveAspectRatio="xMidYMid slice"></image><circle cx="420" cy="108" r="22" fill="none" stroke-width="1.5" style="stroke:var(--cds-chart-axis)"></circle><line x1="420" y1="130" x2="420" y2="204"></line><line x1="388" y1="154" x2="452" y2="154"></line><line x1="420" y1="204" x2="398" y2="250"></line><line x1="420" y1="204" x2="442" y2="250"></line></g><text data-claude-text-id="you-label" x="452" y="246" font-size="11.5" style="fill:var(--cds-text-secondary)">you, completely unbothered</text><g data-claude-anchor="bubble"><rect x="452" y="52" width="262" height="34" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><path d="M466 86L444 100L482 86" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></path><text data-claude-text-id="bubble-words" x="583" y="74" text-anchor="middle" style="fill:var(--cds-text-primary)">Did something just go through me?</text></g><g data-claude-anchor="earth"><rect x="300" y="262" width="436" height="40" rx="8" stroke-width="1.25" style="fill:var(--cds-chart-reference-tint);stroke:var(--cds-chart-axis)"></rect><text data-claude-text-id="earth-words" x="518" y="286" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">… and almost all of them carry on straight through the Earth</text></g></svg>