<svg class="blog-diagram" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 440" role="img" aria-label="What we can see is only the tip of the cosmic iceberg" font-size="13"><rect width="760" height="440" style="fill:var(--fig-bg)"/><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">What we can see is only the tip of the cosmic iceberg</text><rect x="24" y="150" width="712" height="270" rx="8" fill-opacity="0.08" stroke="none" style="fill:var(--cds-chart-categorical-1)"></rect><line x1="24" y1="150" x2="736" y2="150" stroke-width="1.5" style="stroke:var(--cds-chart-categorical-1)"></line><g data-claude-anchor="tip"><path d="M300 150L338 102L370 80L402 112L432 150Z" fill-opacity="0.2" stroke-width="2" style="fill:var(--cds-chart-categorical-3);stroke:var(--cds-chart-categorical-3)"></path><text data-claude-text-id="tip-name" x="448" y="100" font-weight="600" style="fill:var(--cds-text-primary)">Ordinary matter ≈ 5%</text><text data-claude-text-id="tip-body" x="448" y="118" font-size="11.5" style="fill:var(--cds-text-secondary)">stars, gas, planets, you and me</text></g><g data-claude-anchor="penguin" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"><ellipse cx="352" cy="84" rx="6" ry="9"></ellipse><circle cx="352" cy="71" r="4"></circle><path d="M356 71l5 1"></path></g><text data-claude-text-id="penguin-note" x="336" y="66" text-anchor="end" font-size="11.5" style="fill:var(--cds-text-secondary)">a penguin (there are none at the South Pole)</text><g data-claude-anchor="underwater"><path d="M232 150L500 150L560 262L522 380L380 412L242 372L190 254Z" fill-opacity="0.14" stroke-width="1.5" style="fill:var(--cds-chart-categorical-2);stroke:var(--cds-chart-categorical-2)"></path><path d="M206 262H556" fill="none" stroke-width="1" stroke-dasharray="4 4" style="stroke:var(--cds-chart-axis)"></path><text data-claude-text-id="dm-name" x="376" y="204" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Dark matter ≈ 26%</text><text data-claude-text-id="dm-body" x="376" y="222" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">holds galaxies together; nobody knows what it is</text><text data-claude-text-id="de-name" x="376" y="316" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Dark energy ≈ 69%</text><text data-claude-text-id="de-body" x="376" y="334" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">makes the expansion speed up; even more mysterious</text></g><text data-claude-text-id="waterline" x="728" y="142" text-anchor="end" font-size="11.5" style="fill:var(--cds-text-secondary)">what telescopes see</text><text data-claude-text-id="below" x="728" y="170" text-anchor="end" font-size="11.5" style="fill:var(--cds-text-secondary)">what we infer</text></svg>