<svg class="blog-diagram" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 504" role="img" aria-label="Muons reach the ground only because their clocks run slow" font-size="13"><rect width="760" height="504" style="fill:var(--fig-bg)"/><defs><marker id="mu-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-categorical-2)"></path></marker></defs><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">Muons reach the ground only because their clocks run slow</text><text data-claude-text-id="head-1" x="150" y="76" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Without relativity</text><text data-claude-text-id="head-2" x="390" y="76" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Seen from the ground</text><text data-claude-text-id="head-3" x="630" y="76" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Seen by the muon</text><text data-claude-text-id="alt-top" x="24" y="116" font-size="11.5" style="fill:var(--cds-text-secondary)">≈ 15 km up</text><text data-claude-text-id="alt-ground" x="24" y="424" font-size="11.5" style="fill:var(--cds-text-secondary)">ground</text><g data-claude-anchor="col-newton"><rect x="114" y="96" width="72" height="324" rx="6" stroke-width="1" style="fill:var(--cds-chart-reference-tint);stroke:var(--cds-chart-axis)"></rect><circle cx="150" cy="112" r="7" fill-opacity="0.35" stroke-width="2" style="fill:var(--cds-chart-categorical-2);stroke:var(--cds-chart-categorical-2)"></circle><path d="M150 122V150" stroke-width="2" marker-end="url(#mu-arrow)" style="stroke:var(--cds-chart-categorical-2)"></path><path d="M150 154l4 8l9 1l-7 6l2 9l-8 -5l-8 5l2 -9l-7 -6l9 -1z" fill-opacity="0.25" stroke-width="1.25" style="fill:var(--cds-chart-status-critical);stroke:var(--cds-chart-status-critical)"></path><text data-claude-text-id="bye" x="172" y="172" style="fill:var(--cds-text-primary)">Bye!</text></g><g data-claude-anchor="col-ground"><rect x="354" y="96" width="72" height="324" rx="6" stroke-width="1" style="fill:var(--cds-chart-reference-tint);stroke:var(--cds-chart-axis)"></rect><circle cx="390" cy="112" r="7" fill-opacity="0.35" stroke-width="2" style="fill:var(--cds-chart-categorical-2);stroke:var(--cds-chart-categorical-2)"></circle><circle cx="420" cy="112" r="11" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></circle><path d="M420 112V104M420 112H426" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></path><path d="M390 122V404" stroke-width="2" marker-end="url(#mu-arrow)" style="stroke:var(--cds-chart-categorical-2)"></path><text data-claude-text-id="made-it" x="406" y="402" style="fill:var(--cds-text-primary)">Made it!</text></g><g data-claude-anchor="col-muon"><rect x="594" y="388" width="72" height="32" rx="6" stroke-width="1" style="fill:var(--cds-chart-reference-tint);stroke:var(--cds-chart-axis)"></rect><circle cx="630" cy="368" r="7" fill-opacity="0.35" stroke-width="2" style="fill:var(--cds-chart-categorical-2);stroke:var(--cds-chart-categorical-2)"></circle><path d="M630 378V412" stroke-width="2" marker-end="url(#mu-arrow)" style="stroke:var(--cds-chart-categorical-2)"></path><text data-claude-text-id="quick" x="646" y="372" style="fill:var(--cds-text-primary)">That was quick.</text></g><line x1="100" y1="420" x2="700" y2="420" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></line><text data-claude-text-id="b1-1" x="150" y="448" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">lifetime 2.2 µs × speed of light</text><text data-claude-text-id="b1-2" x="150" y="464" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">= only about 0.66 km of travel</text><text data-claude-text-id="b1-3" x="150" y="480" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">It never reaches the ground.</text><text data-claude-text-id="b2-1" x="390" y="448" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">Its clock runs about 50× slower</text><text data-claude-text-id="b2-2" x="390" y="464" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">for us (γ ≈ 50 at 5 GeV)</text><text data-claude-text-id="b2-3" x="390" y="480" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">It crosses 15 km with time to spare.</text><text data-claude-text-id="b3-1" x="630" y="448" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">To the muon, the atmosphere</text><text data-claude-text-id="b3-2" x="630" y="464" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-primary)">shrinks about 50×, to ~300 m</text><text data-claude-text-id="b3-3" x="630" y="480" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">Same physics, other point of view.</text></svg>