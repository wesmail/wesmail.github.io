<svg class="blog-diagram" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 460" role="img" aria-label="Higher meant stronger: the mystery radiation came from the sky" font-size="13"><rect width="760" height="460" style="fill:var(--fig-bg)"/><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">Higher meant stronger: the mystery radiation came from the sky</text><g data-claude-anchor="links" fill="none" stroke-width="1" stroke-dasharray="4 4" style="stroke:var(--cds-chart-axis)"><path d="M342 100H440"></path><path d="M126 266L440 212"></path><path d="M318 398L440 330"></path></g><g data-claude-anchor="balloon"><circle cx="300" cy="100" r="40" fill-opacity="0.12" stroke-width="2" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"></circle><line x1="272" y1="130" x2="286" y2="156" style="stroke:var(--cds-chart-axis)"></line><line x1="328" y1="130" x2="314" y2="156" style="stroke:var(--cds-chart-axis)"></line><rect x="282" y="156" width="36" height="20" rx="3" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><circle cx="300" cy="149" r="6" fill="none" style="stroke:var(--cds-chart-axis)"></circle><text data-claude-text-id="balloon-who" x="300" y="196" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">Hess and his electroscopes</text></g><g data-claude-anchor="tower" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"><path d="M70 376L102 266H118L150 376"></path><path d="M84 330H136"></path><path d="M94 300H126"></path><path d="M92 376Q110 346 128 376"></path><line x1="110" y1="266" x2="110" y2="250"></line></g><text data-claude-text-id="tower-name" x="110" y="240" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">Eiffel Tower, ~300 m</text><g data-claude-anchor="ground-and-sea"><line x1="24" y1="376" x2="200" y2="376" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></line><rect x="200" y="376" width="220" height="60" fill-opacity="0.15" stroke="none" style="fill:var(--cds-chart-categorical-2)"></rect><line x1="200" y1="376" x2="420" y2="376" stroke-width="1.25" style="stroke:var(--cds-chart-categorical-2)"></line><rect x="292" y="392" width="26" height="18" rx="2" fill="none" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><ellipse cx="240" cy="418" rx="14" ry="6" fill="none" style="stroke:var(--cds-chart-axis)"></ellipse><path d="M254 418l10 -6v12z" fill="none" style="stroke:var(--cds-chart-axis)"></path></g><text data-claude-text-id="sea-name" x="410" y="428" text-anchor="end" font-size="11.5" style="fill:var(--cds-text-secondary)">the sea, 3 m down</text><text data-claude-text-id="fish" x="212" y="446" font-size="11.5" style="fill:var(--cds-text-secondary)">fish: unimpressed</text><g data-claude-anchor="card-hess"><rect x="440" y="56" width="296" height="88" rx="8" fill-opacity="0.12" stroke-width="2" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"></rect><text data-claude-text-id="hess-name" x="452" y="80" font-weight="600" style="fill:var(--cds-text-primary)">1912 · Hess, balloon to 5,200 m</text><text data-claude-text-id="hess-1" x="452" y="98" font-size="11.5" style="fill:var(--cds-text-primary)">Ionization rises with height: above 4,000 m</text><text data-claude-text-id="hess-2" x="452" y="114" font-size="11.5" style="fill:var(--cds-text-primary)">it is more than double the ground value.</text><text data-claude-text-id="hess-3" x="452" y="130" font-size="11.5" style="fill:var(--cds-text-primary)">Day or night: no difference.</text></g><g data-claude-anchor="card-wulf"><rect x="440" y="168" width="296" height="88" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text data-claude-text-id="wulf-name" x="452" y="192" font-weight="600" style="fill:var(--cds-text-primary)">1909 · Wulf, top of the Eiffel Tower</text><text data-claude-text-id="wulf-1" x="452" y="210" font-size="11.5" style="fill:var(--cds-text-primary)">If the ground were the source, 300 m of air</text><text data-claude-text-id="wulf-2" x="452" y="226" font-size="11.5" style="fill:var(--cds-text-primary)">should have removed almost all of it.</text><text data-claude-text-id="wulf-3" x="452" y="242" font-size="11.5" style="fill:var(--cds-text-primary)">It dropped by less than half.</text></g><g data-claude-anchor="card-pacini"><rect x="440" y="286" width="296" height="88" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></rect><text data-claude-text-id="pacini-name" x="452" y="310" font-weight="600" style="fill:var(--cds-text-primary)">1911 · Pacini, 3 m under water</text><text data-claude-text-id="pacini-1" x="452" y="328" font-size="11.5" style="fill:var(--cds-text-primary)">Water blocks the ground&#x27;s radioactivity,</text><text data-claude-text-id="pacini-2" x="452" y="344" font-size="11.5" style="fill:var(--cds-text-primary)">yet ionization fell by only about 20%.</text><text data-claude-text-id="pacini-3" x="452" y="360" font-size="11.5" style="fill:var(--cds-text-primary)">Much of it comes from somewhere else.</text></g></svg>