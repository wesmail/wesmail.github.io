<svg class="blog-diagram" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 390" role="img" aria-label="Only neutrinos come straight from the heart of a cosmic accelerator" font-size="13"><rect width="760" height="390" style="fill:var(--fig-bg)"/><defs><marker id="mm-nu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-categorical-1)"></path></marker><marker id="mm-pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--cds-chart-categorical-4)"></path></marker></defs><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">Only neutrinos come straight from the heart of a cosmic accelerator</text><g data-claude-anchor="source"><line x1="90" y1="212" x2="90" y2="104" stroke-width="3" style="stroke:var(--cds-chart-categorical-1)"></line><line x1="90" y1="212" x2="90" y2="318" stroke-width="3" style="stroke:var(--cds-chart-categorical-1)"></line><ellipse cx="90" cy="212" rx="36" ry="9" fill-opacity="0.3" stroke-width="1.25" style="fill:var(--cds-chart-categorical-3);stroke:var(--cds-chart-categorical-3)"></ellipse><circle cx="90" cy="212" r="9" fill="#000000" stroke-width="1.5" style="stroke:var(--cds-text-primary)"></circle><text data-claude-text-id="src-name" x="90" y="350" text-anchor="middle" font-size="11.5" font-weight="600" style="fill:var(--cds-text-primary)">black hole + jet</text><text data-claude-text-id="src-2" x="90" y="366" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">(or two neutron stars merging)</text></g><g data-claude-anchor="earth"><rect x="650" y="60" width="86" height="310" rx="8" stroke-width="1.25" style="fill:var(--cds-chart-reference-tint);stroke:var(--cds-chart-axis)"></rect><text data-claude-text-id="earth" x="693" y="206" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Earth</text><text data-claude-text-id="earth-2" x="693" y="224" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">(and IceCube)</text></g><path d="M130 196Q215 64 300 96T450 140T560 90T648 140" fill="none" stroke-width="2" marker-end="url(#mm-pr)" style="stroke:var(--cds-chart-categorical-4)"></path><text data-claude-text-id="cr-1" x="152" y="60" font-size="11.5" font-weight="600" style="fill:var(--cds-text-primary)">Cosmic ray: bent by magnetic fields,</text><text data-claude-text-id="cr-2" x="152" y="76" font-size="11.5" style="fill:var(--cds-text-primary)">arrives from the wrong direction</text><path d="M134 214H462" fill="none" stroke-width="2" style="stroke:var(--cds-chart-categorical-3)"></path><ellipse cx="502" cy="214" rx="38" ry="26" stroke-width="1" stroke-dasharray="4 3" style="fill:var(--cds-chart-reference-tint);stroke:var(--cds-chart-axis)"></ellipse><path d="M534 204l16 20M550 204l-16 20" stroke-width="2" style="stroke:var(--cds-chart-status-critical)"></path><text data-claude-text-id="ga-1" x="160" y="204" font-size="11.5" font-weight="600" style="fill:var(--cds-text-primary)">Gamma ray: travels straight, but at high</text><text data-claude-text-id="ga-2" x="160" y="232" font-size="11.5" style="fill:var(--cds-text-primary)">energy it is absorbed on long trips</text><text data-claude-text-id="fog" x="502" y="256" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">background light</text><path d="M134 292H646" fill="none" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#mm-nu)" style="stroke:var(--cds-chart-categorical-1)"></path><text data-claude-text-id="nu-1" x="160" y="282" font-size="11.5" font-weight="600" style="fill:var(--cds-text-primary)">Neutrino: straight and unstoppable, points right back home</text><path d="M150 344L160 351.4563126877378L170 349.4037054444092L180 340.4598364536